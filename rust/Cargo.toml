[package]
name = "cycles_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
crc32fast = "1.4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["net", "io-util", "sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.20"
mdns-sd = "0.21.3"
base64 = "0.23.1"
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["bluetoothd", "l2cap"] }
